services:
  pg-primary:
    image: postgres:18.6
    container_name: threadhaus-pg-primary
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: threadhaus
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}
      REPLICATION_NETWORK_CIDR: 172.25.0.0/24
      REPLICATION_HOST_GATEWAY: 172.25.0.1
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - pg_primary_data:/var/lib/postgresql
      - ./primary-init.sh:/docker-entrypoint-initdb.d/10-replication-setup.sh:ro
    networks:
      - pg_repl_net

  pg-replica:
    image: postgres:18.6
    container_name: threadhaus-pg-replica
    restart: unless-stopped
    environment:
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}
      PRIMARY_HOST: pg-primary
      REPLICATION_SLOT: threadhaus_replica
      PGPASSFILE: /var/lib/postgresql/.pgpass
    entrypoint: ["/usr/local/bin/replica-init.sh"]
    command:
      - postgres
      - -c
      - hot_standby=on
    ports:
      - "127.0.0.1:5441:5432"
    volumes:
      - pg_replica_data:/var/lib/postgresql
      - ./replica-init.sh:/usr/local/bin/replica-init.sh:ro
    networks:
      - pg_repl_net
    depends_on:
      - pg-primary

volumes:
  pg_primary_data:
    name: threadhaus_pg_primary_data
  pg_replica_data:
    name: threadhaus_pg_replica_data

networks:
  pg_repl_net:
    name: threadhaus-pg-repl
    ipam:
      config:
        - subnet: 172.25.0.0/24
